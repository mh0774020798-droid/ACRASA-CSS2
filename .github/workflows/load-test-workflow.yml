name: "🚀 בדיקת מהירות פורום בני ברק"

on:
  workflow_dispatch:
    inputs:
      total_vus:
        description: '👥 מספר משתמשים מדומים במקביל (1–100; התחילו ב־5)'
        required: true
        default: '5'
        type: string
      duration:
        description: '⏱️ משך הבדיקה'
        required: true
        default: '1m'
        type: choice
        options:
          - '1m'
          - '3m'
          - '5m'

permissions:
  contents: read

concurrency:
  group: bnebrak-forum-load-test
  cancel-in-progress: false

jobs:
  load-test:
    name: '📊 בדיקה ודוח בעברית'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TARGET_URL: https://bnebrak.com
      TOTAL_VUS: ${{ inputs.total_vus }}
      TEST_DURATION: ${{ inputs.duration }}
    steps:
      - name: '📥 הכנת קובצי הבדיקה'
        uses: actions/checkout@v4

      - name: '🔧 התקנת כלי המדידה'
        run: bash scripts/install-k6.sh

      - name: '🚀 בדיקת זמינות, עלייה בעומס ומדידת מהירות'
        id: load
        run: |
          # שומרים את קוד היציאה וגם מכשילים את הריצה כשהיעדים לא הושגו.
          status=0
          k6 run --quiet load-test.js || status=$?
          printf '%s\n' "$status" > k6-exit-code.txt
          exit "$status"

      - name: '📝 סיכום ברור בעברית ודוח להורדה'
        if: always()
        run: |
          status=0
          python3 summarize.py summary.json \
            --exit-code-file k6-exit-code.txt \
            --markdown report.md --html report.html || status=$?
          if [ -f report.md ]; then
            cat report.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: '💾 שמירת הדוח והנתונים'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bnebrak-performance-report-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            report.html
            report.md
            summary.json
            k6-exit-code.txt
