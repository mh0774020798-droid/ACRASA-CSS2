name: "🚀 בדיקת עומס אתר עוגן פליי"

on:
  workflow_dispatch:
    inputs:
      total_vus:
        description: '👥 מספר משתמשים מדומים במקביל (1–100; התחילו ב־5)'
        required: true
        default: '5'
        type: string
      min_wait_seconds:
        description: '⏳ המתנה מינימלית בין בקשות של כל משתמש (1–30 שניות)'
        required: true
        default: '1'
        type: string
      max_wait_seconds:
        description: '⏳ המתנה מקסימלית בין בקשות של כל משתמש (עד 30 שניות)'
        required: true
        default: '3'
        type: string
      authorize_target:
        description: '🔐 אישור: האתר בבעלותי או שיש לי הרשאה מפורשת לבדוק אותו'
        required: true
        default: false
        type: boolean
      duration:
        description: '⏱️ משך הבדיקה'
        required: true
        default: '1m'
        type: choice
        options:
          - '1m'
          - '3m'
          - '5m'

permissions:
  contents: read

concurrency:
  group: ogenplay-site-load-test
  cancel-in-progress: false

jobs:
  load-test:
    name: '📊 בדיקה ודוח בעברית'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TARGET_URL: https://ogenplay.com
      TOTAL_VUS: ${{ inputs.total_vus }}
      TEST_DURATION: ${{ inputs.duration }}
      MIN_WAIT_SECONDS: ${{ inputs.min_wait_seconds }}
      MAX_WAIT_SECONDS: ${{ inputs.max_wait_seconds }}
    steps:
      - name: '🔐 אישור מפורש לפני יצירת עומס'
        env:
          AUTHORIZE_TARGET: ${{ inputs.authorize_target }}
        run: |
          if [ "$AUTHORIZE_TARGET" != "true" ]; then
            echo "🛑 לא הופעל עומס. יש לאשר בעלות או הרשאה מפורשת בשדה authorize_target."
            exit 1
          fi

      - name: '📥 הכנת קובצי הבדיקה'
        uses: actions/checkout@v4

      - name: '🔧 התקנת כלי המדידה'
        run: bash scripts/install-k6.sh

      - name: '🚀 בדיקת זמינות, עלייה בעומס ומדידת מהירות'
        id: load
        run: |
          # מציגים את הערכים בפועל כדי שאפשר יהיה לזהות טעות בהגדרות עוד לפני k6.
          echo "👥 משתמשים מדומים: $TOTAL_VUS"
          echo "⏱️ משך הבדיקה: $TEST_DURATION"
          echo "🔁 המתנה מינימלית: $MIN_WAIT_SECONDS שניות"
          echo "🔁 המתנה מקסימלית: $MAX_WAIT_SECONDS שניות"

          # בודקים את טווחי ההמתנה מראש, כדי להציג הודעה ברורה במקום stack trace של k6.
          status=0
          if ! python3 - <<'PY'
          import os
          import re
          import sys
          from decimal import Decimal, InvalidOperation

          raw_min = os.environ.get("MIN_WAIT_SECONDS", "")
          raw_max = os.environ.get("MAX_WAIT_SECONDS", "")
          number = r"^\d+(?:\.\d{1,2})?$"

          if not re.fullmatch(number, raw_min) or not re.fullmatch(number, raw_max):
              print(f"🛑 ערכי המתנה לא תקינים: מינימום='{raw_min}', מקסימום='{raw_max}'. יש להזין מספרים כמו 1 ו־3.")
              sys.exit(1)

          try:
              min_wait = Decimal(raw_min)
              max_wait = Decimal(raw_max)
          except InvalidOperation:
              print(f"🛑 לא ניתן לקרוא את ערכי ההמתנה: מינימום='{raw_min}', מקסימום='{raw_max}'.")
              sys.exit(1)

          if min_wait < 1 or max_wait > 30 or max_wait < min_wait:
              print(f"🛑 טווח לא תקין: מינימום='{raw_min}', מקסימום='{raw_max}'. יש לבחור שני ערכים בין 1 ל־30, והמקסימום חייב להיות גדול או שווה למינימום. דוגמה: 1 ו־3.")
              sys.exit(1)
          PY
          then
            status=1
          else
            # שומרים את קוד היציאה וגם מכשילים את הריצה כשהיעדים לא הושגו.
            k6 run --quiet load-test.js || status=$?
          fi

          printf '%s\n' "$status" > k6-exit-code.txt
          exit "$status"

      - name: '📝 סיכום ברור בעברית ודוח להורדה'
        if: always()
        run: |
          status=0
          python3 summarize.py summary.json \
            --exit-code-file k6-exit-code.txt \
            --markdown report.md --html report.html || status=$?
          if [ -f report.md ]; then
            cat report.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: '💾 שמירת הדוח והנתונים'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ogenplay-performance-report-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            report.html
            report.md
            summary.json
            k6-exit-code.txt
